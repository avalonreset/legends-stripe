[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "legends-stripe"
version = "0.1.3"
description = "Stripe CLI, Stripe Checkout, Stripe Billing, B2B Hosted Invoicing, webhook signature verification, declarative catalog sync, Stripe fee calculator telemetry, and Astro/Python blueprints."
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Benjamin Samar / cto-legends"}]
dependencies = []
readme = "README.md"
keywords = [
  "stripe",
  "stripe-cli",
  "stripe-checkout",
  "stripe-billing",
  "stripe-webhook",
  "stripe-fee-calculator",
  "stripe-customer-portal",
  "stripe-python",
  "stripe-price-id",
  "astro-stripe",
  "cto-legends",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Office/Business :: Financial",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.scripts]
legends-stripe = "legends_stripe.cli:main"

[project.urls]
Homepage = "https://cto-legends.com"
Repository = "https://github.com/avalonreset/legends-stripe"
Issues = "https://github.com/avalonreset/legends-stripe/issues"
Changelog = "https://github.com/avalonreset/legends-stripe/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["legends_stripe*"]
